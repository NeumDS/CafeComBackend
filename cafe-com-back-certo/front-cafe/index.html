<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Aroma</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Bibliotecas de terceiros (via CDN, para rodar no navegador) -->
    <!-- axios: fazer chamadas HTTP ao back-end -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- SweetAlert2: popups bonitos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Day.js: formatar datas/horas -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  </head>
  <body>
    <div class="site">
      <header class="cabecalho">
        <h2 class="texto-logo">Café Aroma</h2>
        <nav class="lista">
          <a class="texto-item" href="index.html">Início</a>
          <a class="texto-item" href="menu.html">Menu</a>
          <a class="texto-item" href="#">Contato</a>
        </nav>
      </header>

      <section class="intro">
        <h1 class="intro-titulo">O melhor café da cidade</h1>
        <p class="intro-descricao">
          Grãos selecionados, torra artesanal e aquele aroma que abraça.
        </p>
        <button class="ver-menu-btn" id="btn-ver-menu">Ver menu</button>
      </section>

      <section class="cards">
        <h2 class="nosso-cafe-texto">Nossos cafés</h2>

        <div class="cards-container" id="cards-container"></div>

        <p id="status-cafes" class="status-cafes">Carregando cafés...</p>

        <p id="atualizado" class="atualizado"></p>
      </section>

      <footer class="rodape">
        <span>© 2026 Café Aroma - agora com back-end em Node + axios</span>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
