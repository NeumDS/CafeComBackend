<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Aroma - Menu</title>
    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  </head>
  <body>
    <div class="site">
      <header class="cabecalho">
        <h2 class="texto-logo">Café Aroma</h2>
        <nav class="lista">
          <a class="texto-item" href="index.html">Início</a>
          <a class="texto-item" href="menu.html">Menu</a>
          <a class="texto-item" href="#">Contato</a>
        </nav>
      </header>

      <section class="intro">
        <h1 class="intro-titulo">Nosso cardápio</h1>
        <p class="intro-descricao">Escolha o seu favorito ☕</p>
      </section>

      <section class="menu-lista">
        <div id="menu-container"></div>
        <p id="status-menu" class="status-cafes">Carregando menu...</p>

        <button class="voltar-btn" id="btn-voltar">
          ← Voltar para o início
        </button>
      </section>

      <footer class="rodape">
        <span>© 2026 Café Aroma - agora com back-end em Node + axios</span>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
